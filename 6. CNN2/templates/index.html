<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Vision Hub - Professional Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { --accent: #00f2ff; --bg: #050505; --glass: rgba(255, 255, 255, 0.03); }
        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #fff;
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 0% 0%, #1a1a2e 0%, transparent 50%);
        }
        .dashboard { width: 95%; max-width: 1100px; display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
        .sidebar { background: var(--glass); backdrop-filter: blur(20px); border-radius: 32px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .nav-item {
            padding: 18px; border-radius: 20px; margin-bottom: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 15px; color: #666; border: 1px solid transparent;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active { background: rgba(0,242,255,0.05); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 20px rgba(0,242,255,0.1); }
        
        .main { background: var(--glass); backdrop-filter: blur(20px); border-radius: 32px; padding: 40px; display: flex; flex-direction: column; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        
        .preview-box {
            width: 100%; max-width: 500px; height: 350px; background: rgba(255,255,255,0.02);
            border-radius: 28px; border: 2px dashed #222; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; position: relative; overflow: hidden;
        }
        .preview-box.has-img { border: 1px solid rgba(255,255,255,0.1); }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .btn-group { display: flex; gap: 12px; margin-top: 30px; width: 100%; max-width: 500px; }
        
        .btn-predict {
            flex: 2; padding: 20px; border-radius: 100px; background: var(--accent); color: #000;
            font-weight: 800; font-size: 1.1rem; border: none; cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 242, 255, 0.2);
        }
        .btn-predict:hover { transform: translateY(-3px); box-shadow: 0 15px 50px rgba(0, 242, 255, 0.4); }

        .btn-change-main {
            flex: 1; padding: 20px; border-radius: 100px; background: rgba(255,255,255,0.05); color: #fff;
            font-weight: 600; border: 1px solid rgba(255,255,255,0.1); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-change-main:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        .hud { margin-top: 30px; width: 100%; max-width: 500px; padding: 25px; border-radius: 24px; background: rgba(0,242,255,0.05); border: 1px solid var(--accent); display: none; animation: slideUp 0.4s ease; text-align: center; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h1 style="font-size: 1.8rem; margin-bottom: 40px;">VISION<span style="color:var(--accent)">.</span>AI</h1>
            <div class="nav-item active" onclick="sel('catdog', this)"><i class="ph ph-dog" style="font-size:24px"></i> <span>Chó & Mèo</span></div>
            <div class="nav-item" onclick="sel('cifar10', this)"><i class="ph ph-shapes" style="font-size:24px"></i> <span>CIFAR-10</span></div>
            <div class="nav-item" onclick="sel('plant', this)"><i class="ph ph-leaf" style="font-size:24px"></i> <span>Plant Village</span></div>
        </aside>
        <main class="main">
            <h2 id="title" style="margin-top: 0; font-weight: 300;">Mode: <span style="font-weight: 700; color: var(--accent);">Chó & Mèo</span></h2>
            
            <div class="preview-box" id="drop-zone" onclick="if(!this.classList.contains('has-img')) document.getElementById('file').click()">
                <input type="file" id="file" hidden accept="image/*">
                <div id="placeholder" style="text-align: center; color: #444;">
                    <i class="ph ph-cloud-arrow-up" style="font-size: 4rem;"></i>
                    <p>Click hoặc kéo thả ảnh vào đây</p>
                </div>
                <img id="preview-img">
            </div>

            <div class="btn-group">
                <button class="btn-predict" onclick="predict()">PHÂN TÍCH NGAY</button>
                <button class="btn-change-main" onclick="document.getElementById('file').click()">
                    <i class="ph ph-arrows-clockwise"></i> Đổi ảnh
                </button>
            </div>

            <div class="hud" id="hud">
                <p style="font-size: 0.7rem; text-transform: uppercase; color: var(--accent); letter-spacing: 2px;">Kết quả AI</p>
                <h2 id="resTxt" style="font-size: 2.2rem; margin: 10px 0;">--</h2>
            </div>
        </main>
    </div>
    <script>
        let currentModel = 'catdog';
        function sel(id, el) {
            currentModel = id;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('title').innerHTML = `Mode: <span style="font-weight:700; color:var(--accent);">${el.innerText}</span>`;
            document.getElementById('hud').style.display = 'none';
        }
        document.getElementById('file').onchange = e => {
            const f = e.target.files[0];
            if(f) {
                document.getElementById('preview-img').src = URL.createObjectURL(f);
                document.getElementById('preview-img').style.display = 'block';
                document.getElementById('placeholder').style.display = 'none';
                document.getElementById('drop-zone').classList.add('has-img');
                document.getElementById('hud').style.display = 'none';
            }
        }
        async function predict() {
            const file = document.getElementById('file').files[0];
            if(!file) return alert("Vui lòng chọn ảnh!");
            const btn = document.querySelector('.btn-predict');
            btn.innerText = "ĐANG XỬ LÝ...";
            const fd = new FormData();
            fd.append('file', file); fd.append('model_id', currentModel);
            try {
                const resp = await fetch('/predict', { method: 'POST', body: fd });
                const data = await resp.json();
                document.getElementById('hud').style.display = 'block';
                document.getElementById('resTxt').innerText = data.prediction;
            } catch(e) { alert("Lỗi kết nối!"); }
            btn.innerText = "PHÂN TÍCH NGAY";
        }
    </script>
</body>
</html>
